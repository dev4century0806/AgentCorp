      <feFlood flood-color="#FFF7A6" flood-opacity="0.85"/>
      <feComposite in2="ehlm" operator="in" result="ehl"/>
      <feOffset in="SourceAlpha" dx="1.2" dy="0"/>
      <feGaussianBlur stdDeviation=".5"/>
      <feComposite in="SourceAlpha" operator="out" result="ehsm"/>
      <feFlood flood-color="#FFF2A0" flood-opacity="0.2"/>
      <feComposite in2="ehsm" operator="in" result="ehs"/>
      <feOffset in="SourceAlpha" dx="-.9" dy="0"/>
      <feGaussianBlur stdDeviation=".5"/>
      <feComposite in="SourceAlpha" operator="out" result="erhm"/>
      <feFlood flood-color="#C99400" flood-opacity="0.12"/>
      <feComposite in2="erhm" operator="in" result="erh"/>
      <feOffset in="SourceAlpha" dx="0" dy="-1.1"/>
      <feGaussianBlur stdDeviation=".5"/>
      <feComposite in="SourceAlpha" operator="out" result="eshm"/>
      <feFlood flood-color="#D9A000" flood-opacity="0.3"/>
      <feComposite in2="eshm" operator="in" result="esh"/>
