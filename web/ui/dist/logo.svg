      <stop offset=".025" stop-color="#171B24"/>
      <stop offset=".06" stop-color="#1D222C"/>
      <stop offset=".1" stop-color="#1E242E"/>
      <stop offset=".15" stop-color="#1F2530"/>
      <stop offset=".9" stop-color="#1E242E"/>
