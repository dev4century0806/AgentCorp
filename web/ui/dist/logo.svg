<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="ao-title ao-desc">
  <title id="ao-title">AgentCorp — voxel AI worker icon</title>
  <desc id="ao-desc">Front-facing square-headed agent with blocky charcoal hair and yellow digital eyes.</desc>
  <defs>
