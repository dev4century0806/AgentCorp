      <feOffset dy="5.7" result="m"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="20.7"/>
      <feOffset dy="11.3" result="w"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6.6" result="ao"/>
      <feFlood flood-color="#000" flood-opacity=".19"/>
      <feComposite in2="ao" operator="in" result="as"/>
      <feFlood flood-color="#000" flood-opacity=".36"/>
      <feComposite in2="w" operator="in" result="ws"/>
      <feFlood flood-color="#000" flood-opacity=".25"/>
      <feComposite in2="m" operator="in" result="ms"/>
      <feFlood flood-color="#000" flood-opacity="0.45"/>
      <feComposite in2="t" operator="in" result="ts"/>
