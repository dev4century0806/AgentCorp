      <feMerge><feMergeNode in="ws"/><feMergeNode in="as"/><feMergeNode in="ms"/><feMergeNode in="ts"/><feMergeNode in="SourceGraphic"/><feMergeNode in="hlt"/><feMergeNode in="hll"/><feMergeNode in="sh"/></feMerge>
    </filter>
